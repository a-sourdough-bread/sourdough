<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths.icu Framed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111; /* Background color showing through the thin border */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame-container {
            /* Takes up 96% of the width and 95% of the height for a near-fullscreen look */
            width: 96vw;
            height: 95vh;

            /* Rounded corners and shadow for a clean look */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="frame-container">
        <iframe 
            src="https://maths.icu" 
            sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms"
            allow="popups; popups-to-escape-sandbox">
        </iframe>
    </div>

</body>
</html>
